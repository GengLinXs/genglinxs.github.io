<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  (function () {
    function applyLang(l) {
      document.documentElement.setAttribute('lang', l);
      var label = document.getElementById('lang-label');
      if (label) { label.textContent = (l === 'zh') ? 'EN' : '中文'; }
    }
    var btn = document.getElementById('lang-toggle');
    if (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var cur = document.documentElement.getAttribute('lang') === 'zh' ? 'zh' : 'en';
        var next = cur === 'zh' ? 'en' : 'zh';
        localStorage.setItem('lang', next);
        document.body.classList.add('lang-fading');
        window.setTimeout(function () {
          applyLang(next);
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              document.body.classList.remove('lang-fading');
            });
          });
        }, 180);
      });
    }
    var cur = document.documentElement.getAttribute('lang');
    applyLang(cur === 'zh' ? 'zh' : 'en');
  })();
</script>
